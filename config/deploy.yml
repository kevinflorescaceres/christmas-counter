# Cuenta regresiva en el VPS de Pantheon con Kamal 2. Sin base de datos ni secretos.
service: christmas-counter
image: christmas-counter

servers:
  web:
    hosts:
      - 213.136.85.175
    options:
      memory: 256m

ssh:
  user: deploy

# Registry local de Kamal: la imagen viaja al VPS por un túnel SSH, sin GHCR ni tokens.
registry:
  server: localhost:5555

builder:
  arch: amd64

proxy:
  ssl: true
  host: navidad.florescaceres.cl
  app_port: 8000
  healthcheck:
    path: /up

env:
  clear:
    APP_TIMEZONE: America/Santiago
